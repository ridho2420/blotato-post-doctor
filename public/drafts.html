<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'self'">
  <title>All reply drafts - Blotato Post Doctor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1>All reply drafts</h1>
      <p class="tagline">
        Every customer reply this app can produce: one per sample, then one per known error.
        Read them the way a customer would. <a href="/">Back to the checker</a>
      </p>
      <p id="summary" class="hint"></p>
    </header>

    <p id="message" class="message" role="alert" hidden></p>
    <div id="drafts"></div>
  </main>

  <script src="drafts.js"></script>
</body>
</html>
